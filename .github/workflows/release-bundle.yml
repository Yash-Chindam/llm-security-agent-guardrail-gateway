name: Release bundle

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to bundle.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-bundle:
    name: release-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/guardrail-gateway.tar
          provenance: mode=max
          sbom: true
      - uses: actions/upload-artifact@v7
        with:
          name: guardrail-gateway-oci-${{ inputs.ref }}
          path: ${{ runner.temp }}/guardrail-gateway.tar
          retention-days: 30
