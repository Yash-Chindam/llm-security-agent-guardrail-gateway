name: Release bundle

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to bundle.
        required: true
        type: string

permissions:
  contents: read
  # The signature is issued to this workflow's identity, not to a stored key.
  id-token: write

jobs:
  release-bundle:
    name: release-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/guardrail-gateway.tar
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      # Signed without a long-lived key: the certificate names this workflow
      # in this repository, so a verifier can require exactly that origin.
      - name: Sign the image archive
        working-directory: ${{ runner.temp }}
        run: |
          cosign sign-blob --yes \
            --bundle guardrail-gateway.sigstore.json guardrail-gateway.tar
          sha256sum guardrail-gateway.tar > guardrail-gateway.tar.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: guardrail-gateway-oci-${{ inputs.ref }}
          path: |
            ${{ runner.temp }}/guardrail-gateway.tar
            ${{ runner.temp }}/guardrail-gateway.tar.sha256
            ${{ runner.temp }}/guardrail-gateway.sigstore.json
          retention-days: 30
