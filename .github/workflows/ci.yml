name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest tests/unit --no-cov

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/integration --no-cov

  # The approval and incident stores run the same contract tests on SQLite
  # everywhere. This job runs them against a real PostgreSQL as well, because
  # exactly-once approval use is a property of the database, not of a stand-in.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gateway
          # Reachable only from this job's network, and holds nothing.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GUARDRAIL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit/test_stores.py --no-cov -k postgres

  # The Rego bundle has its own tests, and it must decide exactly as the
  # built-in policy does. Both are checked against a real OPA: its unit tests,
  # then the parity matrix and the whole adversarial suite with OPA deciding.
  opa:
    name: opa
    runs-on: ubuntu-latest
    env:
      OPA_IMAGE: openpolicyagent/opa:1.9.0-static
      GUARDRAIL_TEST_OPA_URL: http://127.0.0.1:8181
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Rego unit tests
        run: docker run --rm -v "$PWD/deploy/opa/policy:/policy:ro" "$OPA_IMAGE" test /policy -v
      - name: Start OPA with the bundle
        run: |
          docker run -d --name opa -p 8181:8181 -v "$PWD/deploy/opa/policy:/policy:ro" \
            "$OPA_IMAGE" run --server --addr 0.0.0.0:8181 --bundle /policy
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/health && exit 0
            sleep 1
          done
          docker logs opa
          exit 1
      - run: pytest tests/integration/test_opa_policy.py --no-cov

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -e .
      - run: npm ci
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: guardrail-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: guardrail-gateway:test
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  release-bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration, postgres, opa, coverage, e2e, security, container]
    uses: ./.github/workflows/release-bundle.yml
    with:
      ref: ${{ github.sha }}
