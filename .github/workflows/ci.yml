name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest tests/unit --no-cov

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/integration --no-cov

  # The approval and incident stores run the same contract tests on SQLite
  # everywhere. This job runs them against a real PostgreSQL as well, because
  # exactly-once approval use is a property of the database, not of a stand-in.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gateway
          # Reachable only from this job's network, and holds nothing.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GUARDRAIL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit/test_stores.py --no-cov -k postgres

  # The Rego bundle has its own tests, and it must decide exactly as the
  # built-in policy does. Both are checked against a real OPA: its unit tests,
  # then the parity matrix and the whole adversarial suite with OPA deciding.
  opa:
    name: opa
    runs-on: ubuntu-latest
    env:
      OPA_IMAGE: openpolicyagent/opa:1.9.0-static
      GUARDRAIL_TEST_OPA_URL: http://127.0.0.1:8181
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Rego unit tests
        run: docker run --rm -v "$PWD/deploy/opa/policy:/policy:ro" "$OPA_IMAGE" test /policy -v
      - name: Start OPA with the bundle
        run: |
          docker run -d --name opa -p 8181:8181 -v "$PWD/deploy/opa/policy:/policy:ro" \
            "$OPA_IMAGE" run --server --addr 0.0.0.0:8181 --bundle /policy
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/health && exit 0
            sleep 1
          done
          docker logs opa
          exit 1
      - run: pytest tests/integration/test_opa_policy.py --no-cov

  # The sandbox's isolation is a property of the container runtime, so it is
  # tested with real containers: code that tries to reach the network, write
  # to the filesystem, exhaust memory or processes, or run forever.
  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    env:
      GUARDRAIL_TEST_SANDBOX_IMAGE: python:3.13-alpine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: docker pull "$GUARDRAIL_TEST_SANDBOX_IMAGE"
      - run: pytest tests/integration/test_sandbox_isolation.py --no-cov

  # The whole topology on real services: the gateway with OPA, PostgreSQL,
  # Kafka, ClickHouse, Prometheus, and Grafana. The smoke test drives the
  # gateway and follows each decision through every one of them.
  compose:
    name: compose
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: deploy/compose/docker-compose.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Generate credentials for this run
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import secrets
          names = ("GUARDRAIL_JWT_SECRET", "CLICKHOUSE_PASSWORD", "GF_SECURITY_ADMIN_PASSWORD")
          for name in names:
              print(f"{name}={secrets.token_urlsafe(36)}")
          database = secrets.token_urlsafe(36)
          print(f"POSTGRES_PASSWORD={database}")
          print("GUARDRAIL_DATABASE_URL=" + "postgresql://gateway:" + database + "@postgres:5432/gateway")
          PY
      - run: docker compose up --build --wait --wait-timeout 480
      - run: python deploy/compose/smoke_test.py
      - if: ${{ failure() }}
        run: docker compose logs --tail 80
      - if: ${{ always() }}
        run: docker compose down --volumes

  # The chart is linted, checked against the Kubernetes schemas, and then
  # installed on a real cluster, where the gateway only becomes ready if its
  # OPA sidecar loaded the policy from the ConfigMap and answered.
  helm:
    name: helm
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/guardrail-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit/test_helm_chart.py --no-cov
      - name: Lint and validate the rendered manifests
        run: |
          set -euo pipefail
          digest="sha256:$(printf 'a%.0s' $(seq 1 64))"
          args=(--set image.repository=registry.example/gateway --set "image.digest=$digest"
                --set existingSecret=guardrail-credentials)
          helm lint "$CHART" "${args[@]}"
          helm template release "$CHART" "${args[@]}" \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -
      - uses: helm/kind-action@v1
        with:
          cluster_name: chart
      - name: Install the chart
        run: |
          set -euo pipefail
          docker build -t guardrail-gateway:ci .
          kind load docker-image guardrail-gateway:ci --name chart
          kubectl create secret generic guardrail-credentials \
            --from-literal=GUARDRAIL_JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          helm install gateway "$CHART" \
            --set image.repository=guardrail-gateway --set image.tag=ci --set image.allowTag=true \
            --set existingSecret=guardrail-credentials --set replicaCount=1 \
            --wait --timeout 240s
      - name: The gateway is ready and OPA is its decision point
        run: |
          set -euo pipefail
          health=$(kubectl exec deploy/gateway-guardrail-gateway -c gateway -- python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read().decode())")
          echo "$health"
          echo "$health" | grep -q '"policy":"available"'
          echo "$health" | grep -q '"status":"ready"'
          kubectl exec deploy/gateway-guardrail-gateway -c gateway -- python -c \
            "import os; assert os.environ['GUARDRAIL_OPA_URL'] == 'http://127.0.0.1:8181'"
      - if: ${{ failure() }}
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl logs deploy/gateway-guardrail-gateway --all-containers --tail 80 || true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -e .
      - run: npm ci
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: guardrail-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: guardrail-gateway:test
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  release-bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration, postgres, opa, sandbox, compose, helm, coverage, e2e, security, container]
    permissions:
      contents: read
      # Keyless signing of the release artifact.
      id-token: write
    uses: ./.github/workflows/release-bundle.yml
    with:
      ref: ${{ github.sha }}
