name: Label-gated automerge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Merge the tested PR when explicitly labeled
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)
          has_label=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json labels --jq 'any(.labels[]; .name == "automerge")')
          if [ "$has_label" != "true" ]; then
            echo "Skipping PR #$PR_NUMBER because it is not labeled for automerge."
            exit 0
          fi
          if [ "$current_sha" != "$TESTED_SHA" ]; then
            echo "Skipping stale CI result for PR #$PR_NUMBER."
            exit 0
          fi

          # The CI workflow is not the only check on a commit. An external
          # check such as secret scanning reports separately, so wait for every
          # check on the tested SHA and refuse to merge over one that failed.
          for attempt in $(seq 1 20); do
            runs=$(gh api "repos/$REPOSITORY/commits/$TESTED_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | {name, status, conclusion}]')
            running=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$running" = "0" ]; then
              break
            fi
            echo "Waiting for $running check(s) on $TESTED_SHA (attempt $attempt)."
            sleep 15
          done
          if [ "$running" != "0" ]; then
            echo "Skipping PR #$PR_NUMBER: checks are still running on $TESTED_SHA."
            exit 0
          fi
          failed=$(jq -r '[.[] | select(.conclusion as $c
            | ["success", "neutral", "skipped"] | index($c) | not) | .name] | join(", ")' <<<"$runs")
          if [ -n "$failed" ]; then
            echo "Skipping PR #$PR_NUMBER: failing check(s) on $TESTED_SHA: $failed"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --merge --delete-branch
          merge_sha=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

  # A merge pushed with GITHUB_TOKEN does not emit a push event, so CI never
  # runs on main for a bot merge. Bundle the merge commit here instead of
  # letting the release artifact silently go missing.
  release-bundle:
    needs: merge
    if: needs.merge.outputs.merge_sha != ''
    permissions:
      contents: read
      # Keyless signing of the release artifact.
      id-token: write
    uses: ./.github/workflows/release-bundle.yml
    with:
      ref: ${{ needs.merge.outputs.merge_sha }}
