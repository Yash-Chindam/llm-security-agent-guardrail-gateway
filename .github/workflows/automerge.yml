name: Label-gated automerge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Merge the tested PR when explicitly labeled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)
          has_label=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json labels --jq 'any(.labels[]; .name == "automerge")')
          if [ "$has_label" != "true" ]; then
            echo "Skipping PR #$PR_NUMBER because it is not labeled for automerge."
            exit 0
          fi
          if [ "$current_sha" != "$TESTED_SHA" ]; then
            echo "Skipping stale CI result for PR #$PR_NUMBER."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --merge --delete-branch
