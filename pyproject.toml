[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "guardrail-gateway"
version = "0.17.0"
description = "Policy-aware security gateway for LLM and agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.23,<5.0",
  "opentelemetry-api>=1.30,<2.0",
  "prometheus-client>=0.22,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "sqlglot>=27.0,<32.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
# Adapters for the section 14 and 18 infrastructure. The gateway runs
# without them; each is needed only when its setting is configured.
kafka = ["kafka-python>=2.2,<3.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]
otel = [
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
]
dev = [
  "bandit[toml]>=1.8,<2.0",
  "kafka-python>=2.2,<3.0",
  "mypy>=1.17,<3.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
  "pip-audit>=2.9,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pytest>=9.0.3,<10.0",
  "pyyaml>=6.0,<7.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
  "types-jsonschema>=4.23,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_gateway"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=guardrail_gateway --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "unit: isolated unit tests",
  "integration: in-process API integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test layers assert, and they carry signing material for a throwaway gateway.
# Bandit already excludes tests entirely; Trivy and secret scanning still cover
# the whole tree for credentials that look real.
# The sandbox tests start local processes with fixed argument vectors.
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]
# The stack smoke test queries its own services with values it generated.
"deploy/**/*.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["guardrail_gateway"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B104"]
