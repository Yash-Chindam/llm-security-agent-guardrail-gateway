[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "guardrail-gateway"
version = "0.9.0"
description = "Policy-aware security gateway for LLM and agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.23,<5.0",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "sqlglot>=27.0,<32.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2.0",
  "mypy>=1.17,<3.0",
  "pip-audit>=2.9,<3.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
  "types-jsonschema>=4.23,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_gateway"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=guardrail_gateway --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "unit: isolated unit tests",
  "integration: in-process API integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test layers assert, and they carry signing material for a throwaway gateway.
# Bandit already excludes tests entirely; Trivy and secret scanning still cover
# the whole tree for credentials that look real.
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["guardrail_gateway"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B104"]
