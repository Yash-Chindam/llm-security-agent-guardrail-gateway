# The deployment topology from section 18 of the design specification, on one
# host: the gateway, its policy decision point, its stores, the event pipeline,
# and the dashboards.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then set the values
#   docker compose -f deploy/compose/docker-compose.yml up --build --wait
#
# Only the edge proxy and Grafana are reachable from the host, and only on
# loopback. The gateway is reached through the edge; everything else lives on
# a network with no route out.
name: guardrail

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# Credentials are never written in this file. A variable listed by name alone
# is passed through from .env, and the preflight service stops the stack from
# starting when any of them is missing, so nothing falls back to a default.
services:
  preflight:
    image: postgres:17-alpine
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    environment:
      - GUARDRAIL_JWT_SECRET
      - GUARDRAIL_DATABASE_URL
      - POSTGRES_PASSWORD
      - CLICKHOUSE_PASSWORD
      - GF_SECURITY_ADMIN_PASSWORD
    entrypoint:
      - /bin/sh
      - -c
      - |
        for name in GUARDRAIL_JWT_SECRET GUARDRAIL_DATABASE_URL POSTGRES_PASSWORD \
                    CLICKHOUSE_PASSWORD GF_SECURITY_ADMIN_PASSWORD; do
          eval "value=\$$$$name"
          if [ -z "$$value" ]; then
            echo "$$name is not set: copy .env.example to .env and set every value" >&2
            exit 1
          fi
        done

  gateway:
    <<: *hardened
    build:
      context: ../..
    environment:
      - GUARDRAIL_JWT_SECRET
      - GUARDRAIL_DATABASE_URL
      - GUARDRAIL_JWT_ISSUER=${GUARDRAIL_JWT_ISSUER:-https://issuer.local}
      - GUARDRAIL_JWT_AUDIENCE=${GUARDRAIL_JWT_AUDIENCE:-guardrail-gateway}
      - GUARDRAIL_OPA_URL=http://opa:8181
      - GUARDRAIL_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GUARDRAIL_PRESIDIO_URL=http://presidio:3000
      - GUARDRAIL_PRESIDIO_TIMEOUT_SECONDS=10
      - GUARDRAIL_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    tmpfs:
      - /tmp:size=16m
    networks: [internal]
    depends_on:
      preflight: {condition: service_completed_successfully}
      opa: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      presidio: {condition: service_healthy}
      tempo: {condition: service_started}

  # The only way in. See envoy.yaml for what it lets through.
  edge:
    <<: *hardened
    image: envoyproxy/envoy:v1.35.3
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    user: "101:101"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    tmpfs:
      - /tmp:size=16m
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8080"
    networks: [public, internal]
    depends_on:
      gateway: {condition: service_healthy}

  # PII recognition inside the trusted boundary: content never leaves it.
  presidio:
    image: mcr.microsoft.com/presidio-analyzer:2.2.360
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      - PORT=3000
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  tempo:
    <<: *hardened
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    tmpfs:
      - /var/tempo:uid=10001,gid=10001,size=256m
    networks: [internal]

  opa:
    <<: *hardened
    image: openpolicyagent/opa:1.9.0-static
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--bundle", "/policy"]
    user: "65532:65532"
    volumes:
      - ../opa/policy:/policy:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "http.send({\"method\": \"GET\", \"url\": \"http://127.0.0.1:8181/health\"}).status_code == 200"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      - POSTGRES_USER=gateway
      - POSTGRES_DB=gateway
      - POSTGRES_PASSWORD
    depends_on:
      preflight: {condition: service_completed_successfully}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # One broker, so one replica of everything. A real cluster uses three.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SYS_NICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      - CLICKHOUSE_USER=analyst
      - CLICKHOUSE_PASSWORD
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks: [internal]
    depends_on:
      preflight: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 24

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  grafana:
    <<: *hardened
    image: grafana/grafana:12.1.1
    environment:
      - GF_SECURITY_ADMIN_PASSWORD
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    tmpfs:
      - /tmp:size=64m
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/guardrail.yml:ro
      - ../grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/guardrail.yml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [public, internal]
    depends_on:
      preflight: {condition: service_completed_successfully}
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24

networks:
  public: {}
  # No route to the outside: the stores and the event pipeline can talk to each
  # other and to the gateway, and to nothing else.
  internal:
    internal: true

volumes:
  postgres-data: {}
  kafka-data: {}
  clickhouse-data: {}
  prometheus-data: {}
  grafana-data: {}
